name: Sync Upstream

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/steveyegge/gastown.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream"
          else
            echo "$BEHIND new commit(s) from upstream"
          fi

      - name: Attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
          fi

      - name: Push clean merge
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        run: git push origin main

      - name: Create PR for conflicts
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync-upstream/$(date -u +%Y-%m-%d)"

          # Check if a sync PR already exists
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING already exists, skipping"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit || true

          # Stage the conflict markers so the branch can be pushed
          git add -A
          git commit -m "sync: merge upstream/main (has conflicts)" || true
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Sync upstream $(date -u +%Y-%m-%d) (conflicts)" \
            --body "$(cat <<'EOF'
          ## Upstream sync — manual resolution needed

          This PR merges the latest changes from `steveyegge/gastown` main.
          There are merge conflicts that need manual resolution.

          **Steps:**
          1. Check out this branch locally
          2. Run `git merge upstream/main` and resolve conflicts
          3. Push and merge this PR

          🤖 Generated by sync-upstream workflow
          EOF
          )" \
            --base main \
            --head "$BRANCH"
